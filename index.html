<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSVolleyball Archive</title>
<style>
:root{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --text:#e8e8e8;--text2:#999;--text3:#555;
  --border:#3a3a3a;--border2:#2a2a2a;
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --blue:#378ADD;--blue-light:#7EB8FF;--blue-bg:#0C2440;
  --green:#2EAB6A;--green-bg:#173404;
  --orange:#FF9A7C;--orange-bg:#3A2008;
  --red:#FF8080;--red-bg:#3A1208;
  --gray-bg:#2e2e2e;
}
*{box-sizing:border-box}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);margin:0;padding-bottom:60px}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px}
.topbar{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:0.5px solid var(--border);padding:16px;text-align:center}
.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.topbar h1{font-size:16px;font-weight:500;margin:0;color:var(--text)}
.mode-toggle{display:flex;gap:8px;justify-content:center}
.mode-btn{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font)}
.mode-btn.active{background:var(--blue-bg);color:var(--blue-light);border-color:var(--blue)}
.filters{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters-left{display:flex;gap:8px;flex-wrap:wrap}
.filters-right{display:flex;gap:8px;flex-wrap:wrap}
.link-btn{padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg3);color:var(--blue-light);font-size:12px;cursor:pointer;font-family:var(--font)}
.season-links-row{display:flex;gap:6px}
select{background:var(--bg2);color:var(--text);border:0.5px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:12px;font-family:var(--font)}
.match-list{display:flex;flex-direction:column;gap:6px}
.match-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:var(--radius);padding:12px 14px;cursor:pointer;border:0.5px solid transparent;gap:12px}
.match-row:hover{border-color:var(--border)}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.season-pill{font-size:10px;padding:2px 8px;border-radius:var(--radius);white-space:nowrap;font-weight:500}
.pill-winter{background:var(--blue-bg);color:var(--blue-light)}
.pill-spring{background:var(--green-bg);color:var(--green)}
.pill-fall{background:var(--orange-bg);color:var(--orange)}
.match-row .opp{font-size:14px;color:var(--text)}
.match-row .meta{font-size:11px;color:var(--text2)}
.badge{font-size:12px;padding:4px 12px;border-radius:var(--radius);white-space:nowrap;font-weight:500;flex-shrink:0}
.badge-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.stats-pill{font-size:9px;padding:2px 8px;border-radius:var(--radius);background:var(--bg3);color:var(--text2);white-space:nowrap;border:0.5px solid var(--border)}
.badge-w{background:var(--green-bg);color:var(--green)}
.badge-l{background:var(--red-bg);color:var(--red)}
.badge-t{background:var(--gray-bg);color:var(--text2)}
.badge-upcoming{background:var(--bg3);color:var(--text3);border:0.5px solid var(--border)}
.season-info-card{background:var(--bg2);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.season-header{margin-bottom:16px}
.season-tab-toggle{display:flex;gap:8px;margin-bottom:16px}
.season-tab-btn{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font)}
.season-tab-btn.active{background:var(--blue-bg);color:var(--blue-light);border-color:var(--blue)}
.stats-subtoggle-wrap{display:flex;justify-content:center;margin:2px 0 18px}
.stats-subtoggle{display:inline-flex;background:var(--bg3);border-radius:999px;padding:3px;gap:2px}
.stats-sub-btn{padding:5px 16px;border-radius:999px;border:none;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font)}
.stats-sub-btn.active{background:var(--orange-bg);color:var(--orange)}
.stats-chart-wrap{margin-bottom:16px}
.stats-chart{width:100%;height:155px;display:block}
.stats-chart-legend{display:flex;justify-content:center;gap:20px;font-size:11px;color:var(--text2);margin-top:6px}
.stats-chart-legend span{display:flex;align-items:center;gap:5px}
.stats-chart-legend .dot{width:8px;height:8px;border-radius:50%}
.season-stats-table{width:100%;border-collapse:collapse;font-size:12px}
.season-stats-table th{font-size:10px;color:var(--text3);font-weight:500;text-align:center;padding:6px 4px;text-transform:uppercase;letter-spacing:.03em}
.season-stats-table td{text-align:center;padding:8px 4px;border-top:0.5px solid var(--border2);color:var(--text)}
.season-stats-table tr{cursor:pointer}
.season-stats-table tr:hover td{background:var(--bg2)}
.season-stats-table tr.stats-summary-row{cursor:default;font-weight:500}
.season-stats-table tr.stats-summary-row td{background:var(--bg2);color:var(--text);border-top:none;border-bottom:1px solid var(--border)}
.season-stats-table tr.stats-summary-row:hover td{background:var(--bg2)}
.season-stats-table th.stat-row-label,.season-stats-table td.stat-row-label{text-align:left;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.season-header .title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.season-select-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.season-header h2{font-size:20px;font-weight:500;margin:0;color:var(--text)}
.season-header .sub{font-size:12px;color:var(--text2)}
.record{font-size:12px;color:var(--text2);margin-bottom:8px}
.record b{color:var(--text)}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--blue-light);cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:var(--font)}
.detail-link{color:var(--blue-light);cursor:pointer}
.detail-link:hover{text-decoration:underline}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.detail-header h2{font-size:18px;font-weight:500;margin:0 0 4px;color:var(--text)}
.detail-header .meta{font-size:12px;color:var(--text2);line-height:1.6}
.video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.no-video{background:var(--bg2);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text3);font-size:12px;margin-bottom:16px}
.empty-note{background:var(--bg2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;margin-bottom:16px}
.section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.roster{font-size:13px;color:var(--text);line-height:1.8}
.roster .subs{color:var(--text2);font-size:12px}
.empty{color:var(--text3);font-size:12px;padding:24px 0;text-align:center}
.box-score{width:100%;border-collapse:collapse;margin-bottom:16px}
.box-score th{font-size:10px;color:var(--text3);font-weight:500;text-align:center;padding:6px 4px;text-transform:uppercase;letter-spacing:.03em}
.box-score th.team-col{text-align:left}
.box-score th.final-col{border-left:1px solid var(--border)}
.box-score td{font-size:14px;color:var(--text);text-align:center;padding:8px 4px;border-top:0.5px solid var(--border2)}
.box-score td.team-name{text-align:left;font-size:13px;color:var(--text2)}
.box-score td.final-col{border-left:1px solid var(--border);font-weight:500}
.box-score td.set-won{color:var(--green);font-weight:500}
.box-score tr.winner td.team-name{color:var(--text)}
.box-score tr.winner td.final-col{color:var(--green)}
.box-score td.set-empty{color:var(--text3)}
.ksv-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--blue-light);background:var(--blue-bg);border:0.5px solid var(--blue);border-radius:var(--radius);padding:8px 14px;margin-top:8px;margin-right:8px;cursor:pointer}
.highlights-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--orange);background:var(--orange-bg);border:0.5px solid var(--orange);border-radius:var(--radius);padding:8px 14px;margin-top:8px;margin-bottom:8px;cursor:pointer}
.video-toggle{display:flex;gap:8px;margin-bottom:8px}
.video-tab{padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font)}
.video-tab.active{background:var(--blue-bg);color:var(--blue-light);border-color:var(--blue)}
.err-butterfly{width:100%}
.err-bf-header{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;margin-bottom:8px}
.err-bf-head-left{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#7EB8FF;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-bf-head-center{font-size:11px;color:var(--text3);text-align:center}
.err-bf-head-right{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#FF9A7E;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-bf-row{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;align-items:center;margin-bottom:6px}
.err-bf-bar-left{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.err-bf-bar-right{display:flex;justify-content:flex-start;align-items:center;gap:4px}
.err-bf-label{font-size:11px;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.err-bf-fill{height:12px;border-radius:2px;min-width:1px}
.err-bf-val{font-size:12px;font-weight:500;color:var(--text2);flex-shrink:0;min-width:16px}
#team-switcher{display:none !important}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row">
    <h1>KSVolleyball Archive</h1>
    <select id="team-switcher" onchange="goTeam(this.value)"></select>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn" id="btn-season" onclick="goCurrentSeason()">Single Season</button>
    <button class="mode-btn" id="btn-all" onclick="goAllSeasons()">All Matches</button>
  </div>
</div>
<div class="wrap" id="app"></div>

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SEASON_PILL_CLASS = {Winter:'pill-winter', Spring:'pill-spring', Fall:'pill-fall'};
// Both files are deployed together — relative path to the tracker in the same folder
const KSV_TRACKER_URL = 'ksv_statTracker.html';

// Teams, in first-appearance order (determines default team)
const teamsList = [];
MATCHES.forEach(m=>{
  if(!teamsList.find(t=>t.slug===m.team)) teamsList.push({slug:m.team, name:m.teamName});
});
const defaultTeam = teamsList[0].slug;
let activeTeam = defaultTeam;

function parseDate(d){
  if(!d) return null;
  const [m,day,y] = d.split('/').map(Number);
  const fullY = y < 100 ? 2000+y : y;
  return new Date(fullY, m-1, day);
}
function shortDate(d){
  const dt = parseDate(d);
  if(!dt) return '';
  return MONTHS[dt.getMonth()]+' '+dt.getDate();
}
function seasonKey(m){ return m.year+'-'+m.season; }
function cap(s){ return s.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }

function teamMatches(slug){ return MATCHES.filter(m=>m.team===slug); }
function seasonOrderFor(slug){
  const arr = [];
  teamMatches(slug).forEach(m=>{ const k=seasonKey(m); if(!arr.includes(k)) arr.push(k); });
  return arr;
}
function currentSeasonFor(slug){ const so=seasonOrderFor(slug); return so[so.length-1]; }

function ytEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{6,})/);
  return m ? 'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0' : null;
}

function seasonPill(m){
  const cls = SEASON_PILL_CLASS[m.season] || 'pill-winter';
  return '<span class="season-pill '+cls+'">'+m.season+' '+m.year+'</span>';
}

function badge(m){
  if(!m.result) return '<span class="badge badge-upcoming">Upcoming</span>';
  const cls = m.result==='W' ? 'badge-w' : (m.result==='L' ? 'badge-l' : 'badge-t');
  const score = (m.sw!=null && m.sl!=null) ? (m.result+' '+m.sw+'-'+m.sl) : m.result;
  return '<span class="badge '+cls+'">'+score+'</span>';
}

function statsTier(m){
  if(!m.ksvImport) return null;
  const lines = m.ksvImport.split('\n');
  let hasBreakdown = false, hasSideouts = false;
  lines.forEach(line=>{
    const c = line.split('\t');
    const breakdownSum = [8,9,10,11,12,20,21,22,23,24].reduce((s,i)=>s+(parseInt(c[i])||0),0);
    if(breakdownSum !== 0) hasBreakdown = true;
    if((c[26]||'').trim() || (c[27]||'').trim()) hasSideouts = true;
  });
  if(hasBreakdown && hasSideouts) return 'Adv Stats+';
  if(hasBreakdown) return 'Adv Stats';
  return 'Stats';
}

function statsPill(m){
  const tier = statsTier(m);
  return tier ? '<span class="stats-pill">'+tier+'</span>' : '';
}

function matchRow(m, scope){
  const label = m.opponent ? ('vs '+m.opponent) : 'TBD';
  const metaParts = [];
  if(m.week) metaParts.push('Week '+m.week);
  if(m.type) metaParts.push(m.type);
  if(m.date) metaParts.push(shortDate(m.date));
  if(m.location) metaParts.push(m.location);
  if(!m.result && m.time) metaParts.push(m.time);
  return '<div class="match-row" onclick="goMatch(\''+m.team+'\',\''+m.id+'\',\''+(scope||'all')+'\')">'
    + '<div>'
    + '<div class="row-top">'+seasonPill(m)+'<span class="opp">'+label+'</span></div>'
    + '<div class="meta">'+metaParts.join(' \u00b7 ')+'</div>'
    + '</div>'
    + '<div class="badge-col">'+badge(m)+statsPill(m)+'</div>'
    + '</div>';
}

function renderTeamSwitcher(){
  const el = document.getElementById('team-switcher');
  el.innerHTML = teamsList.map(t=>
    '<option value="'+t.slug+'"'+(t.slug===activeTeam?' selected':'')+'>'+t.name+'</option>'
  ).join('');
}

function slugify(s){
  return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function parseHash(hash){
  const m = (hash||'').match(/^#\/team\/([^\/]+)\/(.*)$/);
  if(!m) return null;
  const team = decodeURIComponent(m[1]);
  if(!teamsList.find(t=>t.slug===team)) return null;

  const [pathPart, queryPart] = m[2].split('?');
  const segs = pathPart.split('/').filter(Boolean).map(s=>decodeURIComponent(s));
  const query = queryPart || '';

  if(segs.length===1 && segs[0]==='matches') return { team, view:'matches', season:null, query };
  if(segs.length===2 && segs[0]==='match') return { team, view:'match', id:segs[1], query };
  if(segs.length===2 && segs[0]==='season') return { team, view:'season', key:segs[1] };
  if(segs.length===1 && segs[0]==='opponents') return { team, view:'opponents', season:null };
  if(segs.length===1 && segs[0]==='locations') return { team, view:'locations', season:null };
  if(segs.length===2 && segs[0]==='opponent') return { team, view:'opponent', season:null, slug:segs[1] };
  if(segs.length===2 && segs[0]==='location') return { team, view:'location', season:null, slug:segs[1] };
  if(segs.length===3 && segs[0]==='season' && segs[2]==='opponents') return { team, view:'opponents', season:segs[1] };
  if(segs.length===3 && segs[0]==='season' && segs[2]==='locations') return { team, view:'locations', season:segs[1] };
  if(segs.length===4 && segs[0]==='season' && segs[2]==='opponent') return { team, view:'opponent', season:segs[1], slug:segs[3] };
  if(segs.length===4 && segs[0]==='season' && segs[2]==='location') return { team, view:'location', season:segs[1], slug:segs[3] };
  return null;
}

function defaultRoute(){
  return '#/team/'+encodeURIComponent(defaultTeam)+'/season/'+encodeURIComponent(currentSeasonFor(defaultTeam));
}

function scopedList(team, skey){
  const base = teamMatches(team);
  return skey ? base.filter(m=>seasonKey(m)===skey) : base;
}

function router(){
  const parsed = parseHash(location.hash);
  if(!parsed){ location.hash = defaultRoute(); return; }

  activeTeam = parsed.team;
  const app = document.getElementById('app');

  if(parsed.view === 'match'){
    const m = MATCHES.find(x=>x.team===parsed.team && x.id===parsed.id);
    if(!m){ location.hash = defaultRoute(); return; }
    const scopeParams = new URLSearchParams(parsed.query || '');
    const scope = scopeParams.get('scope') || 'all';
    renderMatch(app, m, scope);
  } else if(parsed.view === 'season'){
    if(!parsed.key || !seasonOrderFor(parsed.team).includes(parsed.key)){ location.hash = defaultRoute(); return; }
    document.getElementById('btn-season').classList.add('active');
    renderSeason(app, parsed.team, parsed.key);
  } else if(parsed.view === 'matches'){
    document.getElementById('btn-all').classList.add('active');
    renderAllSeasons(app, parsed.team, parsed.query);
  } else if(parsed.view === 'opponents' || parsed.view === 'locations'){
    if(parsed.season && !seasonOrderFor(parsed.team).includes(parsed.season)){ location.hash = defaultRoute(); return; }
    (parsed.view==='opponents' ? renderOpponentsList : renderLocationsList)(app, parsed.team, parsed.season);
  } else if(parsed.view === 'opponent' || parsed.view === 'location'){
    if(parsed.season && !seasonOrderFor(parsed.team).includes(parsed.season)){ location.hash = defaultRoute(); return; }
    const allTime = teamMatches(parsed.team);
    const field = parsed.view==='opponent' ? 'opponent' : 'location';
    if(!allTime.some(m=>slugify(m[field])===parsed.slug)){ location.hash = defaultRoute(); return; }
    (parsed.view==='opponent' ? renderOpponentDetail : renderLocationDetail)(app, parsed.team, parsed.season, parsed.slug);
  }
  window.scrollTo(0,0);
}

function goAllSeasons(){ location.hash = '#/team/'+encodeURIComponent(activeTeam)+'/matches'; }
function goCurrentSeason(){ location.hash = '#/team/'+encodeURIComponent(activeTeam)+'/season/'+encodeURIComponent(currentSeasonFor(activeTeam)); }
function goMatch(team, id, scope){
  const q = scope && scope!=='all' ? ('?scope='+encodeURIComponent(scope)) : '';
  location.hash = '#/team/'+encodeURIComponent(team)+'/match/'+encodeURIComponent(id)+q;
}
function goTeam(slug){
  const parsed = parseHash(location.hash);
  const view = parsed ? parsed.view : 'season';
  if(view === 'matches'){
    location.hash = '#/team/'+encodeURIComponent(slug)+'/matches';
  } else {
    location.hash = '#/team/'+encodeURIComponent(slug)+'/season/'+encodeURIComponent(currentSeasonFor(slug));
  }
}

function renderAllSeasons(app, team, queryStr){
  const params = new URLSearchParams(queryStr || '');
  const fYear = params.get('year') || '';
  const fSeason = params.get('season') || '';

  const teamList = teamMatches(team);
  const years = [...new Set(teamList.map(m=>m.year))].sort();
  const seasons = [...new Set(teamList.map(m=>m.season))];

  let list = teamList.slice().reverse();
  if(fYear) list = list.filter(m=>m.year===fYear);
  if(fSeason) list = list.filter(m=>m.season===fSeason);

  app.innerHTML = ''
    + '<div class="filters">'
    + '<div class="filters-left">'
    + '<select onchange="setFilter(\'year\', this.value)"><option value="">All years</option>'
      + years.map(y=>'<option value="'+y+'"'+(y===fYear?' selected':'')+'>'+y+'</option>').join('')
    + '</select>'
    + '<select onchange="setFilter(\'season\', this.value)"><option value="">All seasons</option>'
      + seasons.map(s=>'<option value="'+s+'"'+(s===fSeason?' selected':'')+'>'+s+'</option>').join('')
    + '</select>'
    + '</div>'
    + '<div class="filters-right">'
    + '<button class="link-btn" onclick="location.hash=\'#/team/'+encodeURIComponent(team)+'/opponents\'">Opponents</button>'
    + '<button class="link-btn" onclick="location.hash=\'#/team/'+encodeURIComponent(team)+'/locations\'">Locations</button>'
    + '</div>'

    + '</div>';
}

function setFilter(key, val){
  const parsed = parseHash(location.hash);
  const params = new URLSearchParams(parsed ? parsed.query : '');
  if(val) params.set(key, val); else params.delete(key);
  const qs = params.toString();
  location.hash = '#/team/'+encodeURIComponent(activeTeam)+'/matches' + (qs ? '?'+qs : '');
}

function recordStr(list){
  const played = list.filter(m=>m.result);
  const w = played.filter(m=>m.result==='W').length;
  const l = played.filter(m=>m.result==='L').length;
  const t = played.filter(m=>m.result==='T').length;
  return played.length ? (w+'-'+l+(t?'-'+t:'')) : 'No matches played yet';
}

function inferPlace(list){
  const playoffs = list.filter(m=>m.type==='Playoffs' && m.result).sort((a,b)=>(a.weekNum||0)-(b.weekNum||0));
  const n = playoffs.length;
  if(!n) return null;
  const allWon = playoffs.every(g=>g.result==='W');
  if(allWon) return '1st Place (Champions)';
  const last = playoffs[n-1];
  const beforeLast = n>=2 ? playoffs[n-2] : null;
  const allButLastWon = playoffs.slice(0,-1).every(g=>g.result==='W') && last.result==='L';
  if(allButLastWon) return '2nd Place';
  if(beforeLast && beforeLast.result==='L'){
    return last.result==='W' ? '3rd Place' : '4th Place';
  }
  return '? Place';
}

function uniqueNames(list, field){
  const names = new Set();
  list.forEach(m=>{
    if(m[field]) m[field].split(',').forEach(n=>{ n = n.trim(); if(n) names.add(cap(n)); });
  });
  return Array.from(names).sort();
}

function uniqueNames(list, field){
  const names = new Set();
  list.forEach(m=>{
    if(m[field]) m[field].split(',').forEach(n=>{ n = n.trim(); if(n) names.add(cap(n)); });
  });
  return Array.from(names).sort();
}

function fmtStat(n){ return (n==null || isNaN(n)) ? '\u2013' : n.toFixed(2); }
function avgOf(arr, key){
  const vals = arr.map(r=>r[key]).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function seasonStatsRows(list, side){
  return list.filter(m=>m.stats).map(m=>{
    const s = m.stats;
    const att = side==='us' ? s.avgAtt : s.avgOppAtt;
    const blk = side==='us' ? s.avgBlocks : s.avgOppBlocks;
    const srv = side==='us' ? s.avgServes : s.avgOppServes;
    const err = side==='us' ? s.avgOurErrors : s.avgOE;
    const prod = (att!=null||blk!=null||srv!=null) ? ((att||0)+(blk||0)+(srv||0)) : null;
    const prodErr = prod!=null ? prod-(err||0) : null;
    return { match:m, att, blk, srv, err, prod, prodErr };
  });
}

function statsChartSvg(rows){
  const w=680, h=185, padL=8, padR=8, padT=10, padB=26;
  const prodVals = rows.map(r=>r.prod);
  const errVals = rows.map(r=>r.err);
  const allVals = prodVals.concat(errVals).filter(v=>v!=null);
  if(!allVals.length) return '';
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(0, ...allVals);
  const n = rows.length;
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const x = i => padL + i*xStep;
  const y = v => h-padB - ((v-minV)/((maxV-minV)||1))*(h-padT-padB);
  const path = vals => vals.map((v,i)=>(i===0?'M':'L')+x(i)+','+y(v==null?0:v)).join(' ');
  const dots = (vals,color) => vals.map((v,i)=>v==null?'':'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"></circle>').join('');
  const labels = rows.map((r,i)=>'<text x="'+x(i)+'" y="'+(h-8)+'" font-size="9" fill="var(--text3)" text-anchor="middle">Wk'+(r.match.week||'')+'</text>').join('');
  return '<div class="stats-chart-wrap">'
    + '<svg viewBox="0 0 '+w+' '+h+'" class="stats-chart" preserveAspectRatio="none">'
    + '<line x1="'+padL+'" y1="'+y(0)+'" x2="'+(w-padR)+'" y2="'+y(0)+'" stroke="var(--border2)" stroke-width="1"/>'
    + '<path d="'+path(prodVals)+'" fill="none" stroke="#378ADD" stroke-width="2"/>'
    + dots(prodVals,'#378ADD')
    + '<path d="'+path(errVals)+'" fill="none" stroke="#E24B4A" stroke-width="2"/>'
    + dots(errVals,'#E24B4A')
    + labels
    + '</svg>'
    + '<div class="stats-chart-legend"><span><span class="dot" style="background:#378ADD"></span>Production</span><span><span class="dot" style="background:#E24B4A"></span>Errors</span></div>'
    + '</div>';
}

function seasonStatsHtml(list, side, teamLabel){
  const rows = seasonStatsRows(list, side);
  if(!rows.length) return '<div class="empty-note">No stats available for this season</div>';

  const summaryLabel = side==='us' ? teamLabel : 'All Opponents';
  const summaryRow = '<tr class="stats-summary-row">'
    + '<td class="stat-row-label">'+summaryLabel+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'att'))+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'blk'))+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'srv'))+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'err'))+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'prod'))+'</td>'
    + '<td>'+fmtStat(avgOf(rows,'prodErr'))+'</td>'
    + '</tr>';

  const tableRows = rows.map(r=>{
    const wk = r.match.week ? ('Wk'+r.match.week+' ') : '';
    const label = side==='us' ? (wk+'vs '+(r.match.opponent||'TBD')) : (wk+(r.match.opponent||'TBD'));
    return '<tr onclick="goMatch(\''+r.match.team+'\',\''+r.match.id+'\')">'
    + '<td class="stat-row-label">'+label+'</td>'
    + '<td>'+fmtStat(r.att)+'</td>'
    + '<td>'+fmtStat(r.blk)+'</td>'
    + '<td>'+fmtStat(r.srv)+'</td>'
    + '<td>'+fmtStat(r.err)+'</td>'
    + '<td>'+fmtStat(r.prod)+'</td>'
    + '<td>'+fmtStat(r.prodErr)+'</td>'
    + '</tr>';
  }).join('');

  const tableHtml = '<table class="season-stats-table"><thead><tr>'
    + '<th class="stat-row-label">Match</th><th>Att</th><th>Blk</th><th>Srv</th><th>Err</th><th>Prod</th><th>Prod\u2212Err</th>'
    + '</tr></thead><tbody>'+summaryRow+tableRows+'</tbody></table>';

  return statsChartSvg(rows) + tableHtml;
}

function scopeLabelFor(skey){
  return skey ? (skey.split('-')[1]+' '+skey.split('-')[0]) : 'All-time';
}

function opponentStats(list){
  const map = {};
  list.forEach(m=>{
    if(!m.opponent) return;
    const key = m.opponent;
    if(!map[key]) map[key] = { name:key, slug:slugify(key), played:0, w:0, l:0, t:0 };
    if(m.result){
      map[key].played++;
      if(m.result==='W') map[key].w++;
      else if(m.result==='L') map[key].l++;
      else if(m.result==='T') map[key].t++;
    }
  });
  return Object.values(map).sort((a,b)=> b.played-a.played || b.w-a.w || a.name.localeCompare(b.name));
}

function locationStats(list){
  const map = {};
  list.forEach(m=>{
    if(!m.location) return;
    const key = m.location;
    if(!map[key]) map[key] = { name:key, slug:slugify(key), played:0 };
    if(m.result) map[key].played++;
  });
  return Object.values(map).sort((a,b)=> b.played-a.played || a.name.localeCompare(b.name));
}

function renderSeason(app, team, key){
  const [year, season] = key.split('-');
  const list = teamMatches(team).filter(m=>m.year===year && m.season===season);
  const divisions = [];
  list.forEach(m=>{ if(m.division && !divisions.includes(m.division)) divisions.push(m.division); });
  let division = divisions.join(' \u2192 ');

  const hasUpcoming = list.some(m=>!m.result);
  const place = !hasUpcoming ? inferPlace(list) : null;
  if(place) division = division ? (division+' - '+place) : place;

  const overallRecord = recordStr(list);
  const regularRecord = recordStr(list.filter(m=>m.type==='Regular'));

  const coreMembers = uniqueNames(list, 'lineup');
  const subs = uniqueNames(list, 'subs');

  const seasonOrder = seasonOrderFor(team);

  app.innerHTML = ''
    + '<div class="season-info-card">'
    + '<div class="season-header">'
    + '<div class="title-row"><h2>'+season+' '+year+'</h2>'
    + '<div class="season-select-col">'
    + '<select onchange="location.hash=\'#/team/'+encodeURIComponent(team)+'/season/\'+encodeURIComponent(this.value)">'
      + seasonOrder.slice().reverse().map(k=>'<option value="'+k+'"'+(k===key?' selected':'')+'>'+k.split('-')[1]+' '+k.split('-')[0]+'</option>').join('')
    + '</select>'
    + '<div class="season-links-row">'
    + '<button class="link-btn" onclick="location.hash=\'#/team/'+encodeURIComponent(team)+'/season/'+encodeURIComponent(key)+'/opponents\'">Opponents</button>'
    + '<button class="link-btn" onclick="location.hash=\'#/team/'+encodeURIComponent(team)+'/season/'+encodeURIComponent(key)+'/locations\'">Locations</button>'
    + '</div>'
    + '</div>'
    + '</div>'
    + (division ? '<div class="sub">'+division+'</div>' : '')
    + '</div>'
    + '<div class="record">Overall Record: <b>'+overallRecord+'</b></div>'
    + '<div class="record">Regular Season Record: <b>'+regularRecord+'</b></div>'
    + (coreMembers.length ? '<div class="section-title">Core Members</div><div class="roster"><div>'+coreMembers.join(', ')+'</div></div>' : '')

    + '</div>'
    + '</div>'

function boxScoreHtml(m){
  if(!m.setScores || !m.setScores.length){
    return '<div class="empty-note">No set scores available</div>';
  }
  const numCols = Math.max(5, m.setScores.length);
  const usWonCount = m.setScores.filter(s=>s[0]>s[1]).length;
  const themWonCount = m.setScores.filter(s=>s[1]>s[0]).length;
  const usIsWinner = usWonCount > themWonCount;

  const header = '<tr><th class="team-col"></th>'
    + Array.from({length:numCols},(_,i)=>'<th>'+(i+1)+'</th>').join('')
    + '<th class="final-col">Final</th></tr>';

  function cell(val, won){
    if(val==null) return '<td class="set-empty">\u2013</td>';
    return '<td'+(won?' class="set-won"':'')+'>'+val+'</td>';
  }

  const usCells = Array.from({length:numCols},(_,i)=>{
    const s = m.setScores[i];
    return s ? cell(s[0], s[0]>s[1]) : cell(null);
  }).join('');
  const themCells = Array.from({length:numCols},(_,i)=>{
    const s = m.setScores[i];
    return s ? cell(s[1], s[1]>s[0]) : cell(null);
  }).join('');

  const usRow = '<tr'+(usIsWinner?' class="winner"':'')+'><td class="team-name">'+m.teamName+'</td>'+usCells+'<td class="final-col">'+usWonCount+'</td></tr>';
  const themRow = '<tr'+(!usIsWinner?' class="winner"':'')+'><td class="team-name">'+(m.opponent||'Opponent')+'</td>'+themCells+'<td class="final-col">'+themWonCount+'</td></tr>';

  return '<table class="box-score"><thead>'+header+'</thead><tbody>'+usRow+themRow+'</tbody></table>';
}

  return '<a class="ksv-link" href="'+url+'" target="_blank" rel="noopener">Full Stats \u2197</a>';
}

function statsHtml(m){
  if(!m.stats){
    return '<div class="section-title">Match stats</div><div class="empty-note">Stats not available</div>';
  }
  const s = m.stats;
  const cats = [
    {label:'Attack (kill)', mine: s.attacks, theirs: s.oppAttacks, color:'#378ADD'},
    {label:'Block', mine: s.blocks, theirs: s.oppBlocks, color:'#E8C319'},
    {label:'Serve (ace)', mine: s.serves, theirs: s.oppServes, color:'#2EAB6A'},
    {label:'Opponent errors', mine: s.oppErrors, theirs: s.ourErrors, color:'#E24B4A'}
  ];
  const maxVal = Math.max(1, ...cats.flatMap(c=>[c.mine||0, c.theirs||0]));

  const header = '<div class="err-bf-header">'
    + '<div class="err-bf-head-left">'+m.teamName+'</div>'
    + '<div class="err-bf-head-center"></div>'
    + '<div class="err-bf-head-right">'+(m.opponent||'Opponent')+'</div>'
    + '</div>';

  const rows = cats.map(c=>{
    const mv = c.mine!=null ? c.mine : 0;
    const ov = c.theirs!=null ? c.theirs : 0;
    const mPct = Math.round(mv/maxVal*100);
    const oPct = Math.round(ov/maxVal*100);
    return '<div class="err-bf-row">'
      + '<div class="err-bf-bar-left"><div class="err-bf-fill" style="width:'+mPct+'%;background:'+c.color+'"></div><span class="err-bf-val" style="color:'+c.color+'">'+mv+'</span></div>'
      + '<div class="err-bf-label">'+c.label+'</div>'
      + '<div class="err-bf-bar-right"><span class="err-bf-val" style="color:'+c.color+'">'+ov+'</span><div class="err-bf-fill" style="width:'+oPct+'%;background:'+c.color+'"></div></div>'
      + '</div>';
  }).join('');

  const totalRow = '<div class="err-bf-row" style="border-top:0.5px solid var(--border2);margin-top:4px;padding-top:8px">'
    + '<div class="err-bf-bar-left"><span class="err-bf-val" style="color:var(--text)">'+(s.points!=null?s.points:'\u2013')+'</span></div>'
    + '<div class="err-bf-label" style="color:var(--text2)">Total</div>'
    + '<div class="err-bf-bar-right"><span class="err-bf-val" style="color:var(--text)">'+(s.oppPoints!=null?s.oppPoints:'\u2013')+'</span></div>'
    + '</div>';

  return '<div class="section-title">Match stats</div>'
    + '<div class="err-butterfly">' + header + rows + totalRow + '</div>'
    + ksvTrackerLink(m);
}

function videoSection(m){
  const fullEmbed = ytEmbed(m.video);
  const hlEmbed = ytEmbed(m.highlights);

  if(!fullEmbed && !hlEmbed){
    return '<div class="no-video">No video available for this match</div>';
  }
  if(fullEmbed && hlEmbed){
    return '<div class="video-toggle">'
      + '<button class="video-tab active" id="tab-full" onclick="showVideo(\'full\')">Full Match</button>'
      + '<button class="video-tab" id="tab-highlights" onclick="showVideo(\'highlights\')">Highlights</button>'
      + '</div>'
      + '<div class="video-wrap" id="video-full-wrap"><iframe src="'+fullEmbed+'" allowfullscreen></iframe></div>'
      + '<div class="video-wrap" id="video-highlights-wrap" data-src="'+hlEmbed+'" style="display:none"></div>';
  }
  const only = fullEmbed || hlEmbed;
  return '<div class="video-wrap"><iframe src="'+only+'" allowfullscreen></iframe></div>';
}

function showVideo(which){
  const fullWrap = document.getElementById('video-full-wrap');
  const hlWrap = document.getElementById('video-highlights-wrap');
  fullWrap.style.display = which==='full' ? '' : 'none';
  hlWrap.style.display = which==='highlights' ? '' : 'none';
  document.getElementById('tab-full').classList.toggle('active', which==='full');
  document.getElementById('tab-highlights').classList.toggle('active', which==='highlights');
  if(which==='highlights' && !hlWrap.querySelector('iframe')){
    hlWrap.innerHTML = '<iframe src="'+hlWrap.dataset.src+'" allowfullscreen></iframe>';
  }
}

function renderMatch(app, m, scope){
  const seasonPrefix = (scope && scope!=='all') ? ('season/'+encodeURIComponent(scope)+'/') : '';
  const oppHref = m.opponent ? ('#/team/'+encodeURIComponent(m.team)+'/'+seasonPrefix+'opponent/'+encodeURIComponent(slugify(m.opponent))) : null;
  const locHref = m.location ? ('#/team/'+encodeURIComponent(m.team)+'/'+seasonPrefix+'location/'+encodeURIComponent(slugify(m.location))) : null;
  const oppLabel = m.opponent
    ? (oppHref ? '<span class="detail-link" onclick="location.hash=\''+oppHref+'\'">'+m.opponent+'</span>' : m.opponent)
    : 'TBD';

  const meta = [m.type, m.season+' '+m.year, 'Week '+m.week].filter(Boolean).join(' \u00b7 ');
  const locationPart = m.location ? (locHref ? '<span class="detail-link" onclick="location.hash=\''+locHref+'\'">'+m.location+'</span>' : m.location) : '';
  const meta2 = [locationPart, m.date, m.time].filter(Boolean).join(' \u00b7 ');

  let rosterHtml = '';
  if(m.lineup || m.subs){
    rosterHtml = '<div class="section-title">Lineup</div><div class="roster">'
      + (m.lineup ? '<div>'+cap(m.lineup.split(',').map(s=>s.trim()).join(', '))+'</div>' : '')
      + (m.subs ? '<div class="subs">Subs: '+cap(m.subs.split(',').map(s=>s.trim()).join(', '))+'</div>' : '')
      + '</div>';
  }

  app.innerHTML = ''
    + '<button class="back-link" onclick="history.back()">&larr; Back</button>'
    + '<div class="detail-header">'
    + '<div><h2>'+(m.opponent?('vs '+oppLabel):'TBD')+'</h2>'
    + '<div class="meta">'+meta+'<br>'+meta2+'</div></div>'
    + badge(m)
    + '</div>'
    + videoSection(m)
    + boxScoreHtml(m)
    + statsHtml(m)
    + rosterHtml;
}

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
